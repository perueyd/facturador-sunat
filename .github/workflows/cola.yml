# Cada 6 horas le pide al facturador publicado que procese su cola: reenviar
# lo que SUNAT no recibió, consultar tickets de anulaciones y avisar de cuotas
# por vencer. (Al emitir, el envío a SUNAT ya se intenta al instante; esto es
# la red de seguridad.)
#
# Quien lo hace cada 5 minutos es cron-job.org (docs/PUBLICAR.md, paso 5b). Esto es solo la
# reserva por si cron-job.org falla. Antes decía "cada 5 minutos", pero GitHub lo corría
# 3 o 4 veces al día; cada 6 horas gasta lo mismo (~120 minutos al mes, cada vuelta cuenta
# como 1 minuto) y deja margen si el repositorio pasa a privado (2.000 minutos gratis al mes).
#
# No hace nada hasta configurar en GitHub → Settings → Secrets and variables → Actions:
#   - Variable FACTURADOR_URL   (ej. https://facturador-sunat.onrender.com)
#   - Secreto  CLAVE_CRON       (la misma CLAVE_CRON del servidor)
# Ojo: GitHub pausa los horarios si el repositorio pasa 60 días sin cambios; basta
# con volver a activarlo en la pestaña Actions.
name: cola
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  procesar:
    if: ${{ vars.FACTURADOR_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Procesar la cola de envíos a SUNAT
        env:
          URL: ${{ vars.FACTURADOR_URL }}
          CLAVE: ${{ secrets.CLAVE_CRON }}
        run: |
          curl -fsS --max-time 120 -X POST "$URL/v1/cola/procesar" -H "Authorization: Bearer $CLAVE"
